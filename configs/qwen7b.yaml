model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  load_in_4bit: true
  device_map: auto
  trust_remote_code: true

data:
  train_size: 160
  eval_size: 80
  seed: 42
  n_shots: 5
  filler_type: dots        # dots | count | none
  filler_length: 12
  task_types: [chained_eq, mod_algo]

analysis:
  max_length: 512
  batch_size: 4
  tuned_lens_steps: 120
  tuned_lens_lr: 0.005
  patch_pairs: 40
  output_dir: artifacts/pilot_qwen1.5b

training:
  output_dir: checkpoints/dpo_pilot_qwen1.5b
  max_steps: 40
  learning_rate: 1.0e-4
  beta: 0.1
  lambda_obf: 1.0
  rep_obf_weight: 0.5      # 0.0 = pure DPO, >0.0 = DPO + representation obfuscation
  pareto_weights: [0.0, 0.25, 0.5, 1.0, 2.0]
  lora_r: 16
  lora_alpha: 32
  rollouts_per_prompt: 4
  dpo_prompts: 60
