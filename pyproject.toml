[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-hidden-state-monitoring"
version = "0.2.0"
description = "Adversarial Robustness of Hidden-State Monitoring for Filler-Token Computation in LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.46.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.44.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "datasets>=2.20.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
