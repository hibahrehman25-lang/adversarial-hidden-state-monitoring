[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filler-monitoring-pipeline"
version = "0.1.0"
description = "Reproducible hidden-state monitoring experiments for filler-token computation."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
  "datasets>=2.20",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
research = ["transformer-lens>=2.0", "nnsight>=0.4", "tuned-lens>=0.2"]
training = ["trl>=0.11", "peft>=0.13", "bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
